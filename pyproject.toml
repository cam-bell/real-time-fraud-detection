[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-real-time-pipeline"
version = "0.1.0"
description = "Real-time fraud detection simulation, scoring, monitoring, and dashboarding."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<0.14",
  "streamlit>=1.44,<2",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
notebook = [
  "imbalanced-learn>=0.13,<0.15",
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.2,<5",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.11,<0.13",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
